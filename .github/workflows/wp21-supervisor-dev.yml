name: WP21 Supervisor Dev Gate

on:
  pull_request:
    paths:
      - "supervisor/**"
      - ".github/workflows/wp21-supervisor-dev.yml"

concurrency:
  group: wp21-supervisor-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s supervisor/tests -v
