name: WP21 Supervisor Dev Gate

on:
  pull_request:
    paths:
      - "supervisor/**"
      - "backend/app/context.py"
      - "backend/app/services/supervisor.py"
      - "backend/app/mcp/__init__.py"
      - "backend/tests/test_supervisor_client.py"
      - "backend/tests/test_wp21_system_mcp.py"
      - "web/lib/supervisor*"
      - "web/app/api/supervisor/**"
      - "web/app/diagnostics/page.tsx"
      - "web/tests/supervisor-helpers.test.mjs"
      - "web/package.json"
      - ".github/workflows/wp21-supervisor-dev.yml"

concurrency:
  group: wp21-supervisor-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s supervisor/tests -v

  backend-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/test_supervisor_client.py tests/test_wp21_system_mcp.py -q

  frontend-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
