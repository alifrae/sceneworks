name: Prepare v4 dependency lock

on:
  push:
    branches:
      - release/v4.0.0

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v4.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate lock
        run: uv lock
      - name: Commit generated lock when changed
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "Lock dependencies for v4.0.0"
          git push origin HEAD:release/v4.0.0
