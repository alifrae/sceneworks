name: SceneWorks CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: sceneworks-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supervisor:
    name: Lifecycle supervisor tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run supervisor suite
        run: python -m unittest discover -s supervisor/tests -v

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify lock matches project constraints
        run: uv lock --check
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Run non-live backend suite
        run: uv run pytest -m "not live"

  windows-runtime:
    name: Windows runtime integrity
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify lifecycle supervisor and PowerShell launcher
        working-directory: .
        run: |
          python -m unittest discover -s supervisor/tests -v
          powershell -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw scripts/start-sceneworks.ps1))"
      - name: Verify lock matches project constraints
        run: uv lock --check
      - name: Install backend plus pinned OpenHands SDK
        run: uv sync --frozen --extra openhands
      - name: Run Windows runtime/control-plane regressions
        env:
          SCENEWORKS_EXPECT_OPENHANDS: "1"
        run: uv run pytest tests/test_main_startup.py tests/test_backend_health_registry.py tests/test_runtime_control_plane_integrity.py tests/test_runtime_integrity_providers.py -m "not live"

  qualification:
    name: Deterministic qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Run full provider-independent qualification gate
        run: uv run python -m evaluation --json qualification.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-report
          path: backend/qualification.json
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Type-check and production build
        run: npm run build
