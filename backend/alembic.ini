# Alembic configuration for SceneWorks.
#
# The database URL is deliberately NOT set here. It comes from SceneWorks
# settings (SCENEWORKS_DATABASE_URL / backend/.env) and is injected by
# migrations/env.py, so migrations and the running application can never
# disagree about which database they are talking to.
#
# Normal use is automatic: the application upgrades to head at startup
# (app.db.migrations.ensure_schema). This file exists for manual operation:
#
#   uv run alembic current              # what revision is this database on?
#   uv run alembic history              # available revisions
#   uv run alembic upgrade head         # apply pending migrations
#   uv run alembic downgrade -1         # step back one revision
#   uv run alembic revision -m "..."    # create a new revision

[alembic]
script_location = migrations
prepend_sys_path = .
# Revision filenames sort chronologically and carry the slug.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
