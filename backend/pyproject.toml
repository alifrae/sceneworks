[project]
name = "sceneworks"
version = "3.0.0"
description = "AI-native software company control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<3.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "httpx>=0.27",
    "pillow>=11.0,<13.0",
    # Schema migrations. Not optional: SceneWorks stores durable project state
    # (projects, tasks, executions, events, accepted decisions) and a schema
    # change must upgrade an existing database rather than silently doing
    # nothing, which is what Base.metadata.create_all did.
    "alembic>=1.13",
]

[project.optional-dependencies]
# Both packages are required and their versions MUST match: openhands-tools
# imports internals from openhands-sdk, so a mismatched pair installs cleanly
# and then fails at import (WP2.5 hit openhands-tools 1.42.1 against
# openhands-sdk 1.17.0 -> "No module named 'openhands.sdk.utils.path'").
#
# Pinned to the pair WP2.5 validated. Newer releases exist (1.42.1 at the time
# of writing) but currently cannot be installed: openhands-sdk pulls
# lmnr, which pins opentelemetry-semantic-conventions==0.60b1 while
# opentelemetry-instrumentation pins its own matching version, and no
# combination satisfies both (pip: ResolutionImpossible). That is an upstream
# packaging conflict, not a SceneWorks constraint.
openhands = [
    "openhands-sdk==1.17.0",
    "openhands-tools==1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Keep `uv run pytest` portable. On some pytest/uv/Linux combinations the
# console-script directory, not the backend source root, is first on sys.path;
# without this the suite fails in conftest before collecting a single test.
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: drives a full workflow; slow by nature",
    "live: requires a real agent provider and model",
    "openhands: requires a working OpenHands install",
]