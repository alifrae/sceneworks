[project]
name = "sceneworks"
version = "2.5.0"
description = "AI-native software company control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<3.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openhands = [
    "openhands-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
